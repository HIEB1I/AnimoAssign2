<!DOCTYPE html>
<html>
<head>
    <title>Create Calendar Event</title>
</head>
<body>
    <h2>Create Google Calendar Event</h2>
    <form method="POST">
        <label>Add event to:</label><br>
        <input type="radio" name="choice" value="me" checked> My Calendar<br>
        <input type="radio" name="choice" value="others"> Someone else's Calendar<br><br>

        <label>If others, input their Gmail:</label><br>
        <input type="email" name="other_email"><br><br>

        <label>Title:</label><br>
        <input type="text" name="summary" required><br><br>

        <label>Description:</label><br>
        <textarea name="description" rows="4" cols="40"></textarea><br><br>

        <label>Location:</label><br>
        <input type="text" name="location"><br><br>

        <label>Start Time:</label><br>
        <input type="datetime-local" name="start" required><br><br>

        <label>End Time:</label><br>
        <input type="datetime-local" name="end" required><br><br>

        <label>Attendees (comma-separated emails):</label><br>
        <input type="text" name="attendees"><br><br>

        <label>Recurrence (optional, e.g. RRULE:FREQ=DAILY;COUNT=5):</label><br>
        <input type="text" name="recurrence"><br><br>

        <label>Visibility:</label><br>
        <select name="visibility">
            <option value="default">Default</option>
            <option value="public">Public</option>
            <option value="private">Private</option>
        </select><br><br>

        <h3>Reminders</h3>
        <label>Reminder 1:</label>
        <select name="reminder_type1">
            <option value="">None</option>
            <option value="email">Email</option>
            <option value="popup">Popup</option>
        </select>
        <input type="number" name="reminder_minutes1" placeholder="Minutes before"><br><br>

        <label>Reminder 2:</label>
        <select name="reminder_type2">
            <option value="">None</option>
            <option value="email">Email</option>
            <option value="popup">Popup</option>
        </select>
        <input type="number" name="reminder_minutes2" placeholder="Minutes before"><br><br>

        <button type="submit">Create Event</button>
    </form>
</body>
</html>
